name: Browser smoke
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test runner
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Compile translations
        run: npm run build
      - name: Run 320px browser regression
        run: node --test tests/poll-browser-*.mjs
