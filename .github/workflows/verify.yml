name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No dependencies or lockfile: use Node's built-in test runner directly.
      - name: Build localizations
        run: npm run build
      - name: Ensure generated files are committed
        run: git diff --exit-code
      - name: Test application and startup diagnostics
        run: npm test
      - name: Check syntax, local links and asset budgets
        run: npm run check

  session-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/session-ownership.test.mjs tests/session-crash.test.mjs tests/poll-access.test.mjs tests/poll-idempotency.test.mjs tests/poll-interruption.test.mjs tests/poll-create-recovery.test.mjs tests/poll-close-order.test.mjs tests/poll-vote-recovery.test.mjs tests/poll-template-boundary.test.mjs tests/poll-template-recovery.test.mjs tests/poll-deadline.test.mjs
